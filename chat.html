<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harka Chat - AI Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f8f6;color:#123d2c}
header{height:65px;background:#075c3d;color:#fff;display:flex;align-items:center;padding:0 15px;gap:12px;position:sticky;top:0;z-index:5}
.back{color:#fff;text-decoration:none;font-size:25px}
.title{font-size:21px;font-weight:800}
.title span{color:#f4c430}
.chat-wrap{max-width:560px;margin:auto;height:calc(100vh - 65px);display:flex;flex-direction:column}
.profile{background:#fff;padding:12px 15px;border-bottom:1px solid #dfe8e3;display:flex;align-items:center;gap:12px}
.profile img{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#ddd}
.profile-name{font-weight:800;font-size:18px}
.ai-label{font-size:12px;color:#087a4d;margin-top:3px}
.messages{flex:1;overflow-y:auto;padding:18px 13px 95px}
.msg{max-width:82%;padding:11px 14px;border-radius:17px;margin:8px 0;line-height:1.4;font-size:16px;white-space:pre-wrap}
.ai{background:#fff;border:1px solid #e2eae6;margin-right:auto;border-bottom-left-radius:5px}
.user{background:#09a65d;color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.typing{font-size:13px;color:#667970;margin:5px 5px 12px;display:none}
.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe8e3;padding:10px;z-index:5}
.composer-inner{max-width:560px;margin:auto;display:flex;gap:8px}
input{flex:1;border:1px solid #cbd9d2;border-radius:25px;padding:13px 16px;font-size:16px;outline:none}
input:focus{border-color:#09a65d}
button{border:0;background:#09a65d;color:#fff;border-radius:25px;padding:0 19px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.notice{text-align:center;font-size:11px;color:#718078;padding:5px 10px 0}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="Back">←</a>
  <div class="title">Harka <span>Chat</span></div>
</header>

<div class="chat-wrap">
  <div class="profile">
    <img id="profilePhoto" src="images/hauwa.jpg" alt="">
    <div>
      <div class="profile-name" id="profileName">Hauwa Ibrahim</div>
      <div class="ai-label">● AI chat — not a real person</div>
    </div>
  </div>

  <div id="messages" class="messages"></div>
  <div id="typing" class="typing">AI is typing…</div>

  <div class="composer">
    <div class="composer-inner">
      <input id="messageInput" type="text" maxlength="1000" placeholder="Type your message…" autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
    <div class="notice">AI-generated replies. Do not share passwords, payment details, or sensitive personal information.</div>
  </div>
</div>

<script>
const profiles = {
  hauwa:  {name:"Hauwa Ibrahim", location:"Jos, Nigeria", photo:"images/hauwa.jpg"},
  amina:  {name:"Amina Bello", location:"Kano, Nigeria", photo:"images/amina.jpg"},
  fatima: {name:"Fatima Usman", location:"Zaria, Nigeria", photo:"images/fatima.jpg"},
  aisha:  {name:"Aisha Musa", location:"Kaduna, Nigeria", photo:"images/aisha.jpg"}
};

const id = new URLSearchParams(location.search).get("user") || "hauwa";
const profile = profiles[id] || profiles.hauwa;

document.getElementById("profileName").textContent = profile.name;
document.getElementById("profilePhoto").src = profile.photo;
document.getElementById("profilePhoto").alt = profile.name;

const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const typing = document.getElementById("typing");

function addMessage(text, who){
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

addMessage(`Hi! I'm the AI chat for ${profile.name}. I'm here to chat with you. 😊`, "ai");

async function sendMessage(){
  const text = input.value.trim();
  if(!text || sendBtn.disabled) return;

  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  typing.style.display = "block";
  messages.scrollTop = messages.scrollHeight;

  try{
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        profileId:id,
        profileName:profile.name,
        location:profile.location,
        message:text
      })
    });

    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Chat request failed.");

    addMessage(data.reply, "ai");
  }catch(error){
    addMessage("Sorry, the AI chat is temporarily unavailable. Please try again.", "ai");
    console.error(error);
  }finally{
    typing.style.display = "none";
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", e => {
  if(e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
